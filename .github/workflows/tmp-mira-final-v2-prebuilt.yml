name: tmp-mira-final-v2-prebuilt

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/tmp-mira-final-v2-prebuilt.yml'
      - 'mira-final-v2/**'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Materialize frozen locks, tools and exact prebuilt native-C executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/finale/{project/build,tools,locks,logs,manifests}
          cp mira-final-v2/tools/verify_and_import_eltec.py work/finale/tools/
          cp mira-final-v2/tools/analyze_final.py work/finale/tools/
          cp mira-final-v2/locks/EXECUTION_RETRY_LOCK.json work/finale/locks/
          cp mira-final-v2/locks/LR_LOCK.json work/finale/locks/
          printf '%s\n' 'PREREG_FINALE_F192_GRU_v2_SHA256=3cb7f32dd38ef64ba3b5fd3255cd0ebe3ea390d0ac7c6233f2e4c308c2c95edb' > work/finale/locks/PREREG_HASH_LOCK.txt
          cat mira-final-v2/payload/runner_b64_[0-9][0-9] | base64 -d > work/runner.xz
          xz -dc work/runner.xz > work/finale/project/build/mira_finale_runner
          cat mira-final-v2/payload/tok_b64_[0-9][0-9] | base64 -d > work/tokenizer.xz
          xz -dc work/tokenizer.xz > work/finale/project/build/finale_tokenizer
          chmod 755 work/finale/project/build/mira_finale_runner work/finale/project/build/finale_tokenizer
          cd work/finale
          echo '21b40cac714f94954c849d0e8b55c1036494363106b3c30334df4a9640871610  project/build/mira_finale_runner' | sha256sum --check --strict | tee logs/runner_sha256.log
          echo '4261a1a893b4f4d0ab04a74971d4905cbf66433ef14a6f9195872e58c985a5fd  project/build/finale_tokenizer' | sha256sum --check --strict | tee logs/tokenizer_tool_sha256.log
          sha256sum locks/* tools/* | tee locks/REMOTE_INPUT_LOCKS.sha256

      - name: Fetch and verify byte-exact ELTeC archive
        shell: bash
        run: |
          set -euo pipefail
          cd work/finale
          mkdir -p input
          url='https://zenodo.org/api/records/3543333/files/COST-ELTeC%2FELTeC-ita-v0.3.0.zip/content'
          out='input/COST-ELTeC_ELTeC-ita-v0.3.0.zip'
          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 --max-time 900 "$url" -o "$out"
          echo '9195844caf7e1d61e7b44aaa00743c15  input/COST-ELTeC_ELTeC-ita-v0.3.0.zip' | md5sum --check --strict | tee logs/archive_md5.log
          echo '000c804322a19582b40ce6779d2162b1a5c0c1f66eb825b31c6901c58929b529  input/COST-ELTeC_ELTeC-ita-v0.3.0.zip' | sha256sum --check --strict | tee logs/archive_sha256.log
          stat --printf='archive_bytes=%s\n' "$out" | tee logs/archive_size.log

      - name: Import exact 34-work source-disjoint corpus
        shell: bash
        run: |
          set -euo pipefail
          cd work/finale
          python3 tools/verify_and_import_eltec.py input/COST-ELTeC_ELTeC-ita-v0.3.0.zip --out data | tee logs/import.log
          test "$(sha256sum data/train.txt | cut -d' ' -f1)" = 'f090c0c3124aa8545ca941a7f698fd97dc2eec8cc078580ad701b3e2c9169be9'
          test "$(sha256sum data/tune.txt | cut -d' ' -f1)" = '21ec14635891478c03b7e4775d5e8c041d01717e98dde59a1f6a4bbf9600dbb6'
          test "$(sha256sum data/test_dev.txt | cut -d' ' -f1)" = '93d1478e82f76dd9308469b9addc2f93417996a5b97c1848511c072988c1a5f9'
          test "$(sha256sum data/test_confirm.txt | cut -d' ' -f1)" = '4d699121243b98cbc0f11d38054ac5b1b741ed289a45dbebb3156aba94e7fb60'

      - name: Build frozen TRAIN-only tokenizer, token files and orders
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e OMP_NUM_THREADS=4 -e OMP_DYNAMIC=FALSE -v "$PWD/work/finale:/work/finale" -w /work/finale debian:13-slim bash -lc '
            set -euo pipefail
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libgomp1 >/dev/null
            mkdir -p tokenizer prepared orders
            ./project/build/finale_tokenizer data/train.txt tokenizer/tokenizer.bin tokenizer/pieces.tsv data/tune.txt data/test_dev.txt data/test_confirm.txt | tee logs/tokenizer.log
            ./project/build/mira_finale_runner prepare tokenizer/tokenizer.bin data/train.txt data/tune.txt data/test_dev.txt data/test_confirm.txt prepared
            for seed in 137 1972 2718 3141 1618 2026 5772 8119; do ./project/build/mira_finale_runner windows prepared/train.tok orders/train_order_${seed}.bin all ${seed}; done
            ./project/build/mira_finale_runner windows prepared/tune.tok orders/tune_windows.bin all 0
            ./project/build/mira_finale_runner windows prepared/test_dev.tok orders/test_dev_windows.bin test 0
            ./project/build/mira_finale_runner windows prepared/test_confirm.tok orders/test_confirm_windows.bin test 0
          '
          cd work/finale
          echo 'bce8d5ed69bd128466bc2a72db95a7c593388fa8af26aca9f65a526ee67c1785  tokenizer/tokenizer.bin' | sha256sum --check --strict
          echo '0fdcb8072354a1c639a0279e6f223f97e84d7b1b22b2d454c0ac97c3f1854740  prepared/train.tok' | sha256sum --check --strict
          echo '778557dcabb91c6698fd9b620d619f0c8fab5b7cf5ae624964c205bbead6d04a  prepared/tune.tok' | sha256sum --check --strict
          echo '4bccd429dc5d7a234acdd782399f4d60fca111a88f0409a6fa145e7312e7646d  prepared/test_dev.tok' | sha256sum --check --strict
          echo '19cd6f1785a22a07143276d8ca1bb1d1186d0f5106fb961c37925de5e5e49eee  prepared/test_confirm.tok' | sha256sum --check --strict
          echo 'ddfbaab3d78c6ed72352ace036633ab73286826ec6f0bffe32ebfb4e14214577  orders/tune_windows.bin' | sha256sum --check --strict
          echo 'af24fcfc9720b7ec84fc1c8acafe1d6af9b557b9c9e16e3f0ccb2cbdcf9005e9  orders/test_dev_windows.bin' | sha256sum --check --strict
          echo 'e6b16182fbed870e207a0ea118832681aedb11dc292d13f3483c30286d1e0a7f  orders/test_confirm_windows.bin' | sha256sum --check --strict
          echo 'f60046250d225b2c4bc5e70b42724b3d2754ff943a53d09e5c475dd9f231ca46  orders/train_order_1972.bin' | sha256sum --check --strict
          echo '0804a55e1ef24186a24e8e46da797be9e93f6d64fb1bd848444bd06cd0d91a5d  orders/train_order_2718.bin' | sha256sum --check --strict
          echo 'a54fc8269f7f5463f08b97cbce3784563422b17d4f411cbe1c12f4ea0cb69c11  orders/train_order_3141.bin' | sha256sum --check --strict
          echo '48792a6ac64eb1be3689bc29384b2f1490af1139b857822060e8e0363fb8e304  orders/train_order_1618.bin' | sha256sum --check --strict
          echo '68bc37488fc306f27365cfc3efd3c7910290888a2f471acf50ff3255509ea71d  orders/train_order_2026.bin' | sha256sum --check --strict
          echo 'd91e88a36b9ef344153720069aee5e18f09fd939fc6a1acc45674ea4f33798cf  orders/train_order_5772.bin' | sha256sum --check --strict
          echo '7eeff5e93fcb24b30c1e86d20099faff6d628e68826ba4a5486c0b758650906f  orders/train_order_8119.bin' | sha256sum --check --strict
          find project/build tokenizer prepared orders locks tools logs data/audit.json -type f -print0 | sort -z | xargs -0 sha256sum > manifests/PREPARED_SHA256.txt
          rm -f input/COST-ELTeC_ELTeC-ita-v0.3.0.zip data/train.txt data/tune.txt data/test_dev.txt data/test_confirm.txt

      - uses: actions/upload-artifact@v4
        with:
          name: finale-prepared-prebuilt
          path: work/finale
          if-no-files-found: error
          retention-days: 1
          compression-level: 3

  train:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        kind: [f192, gru]
        seed: [1972, 2718, 3141, 1618, 2026, 5772, 8119]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finale-prepared-prebuilt
          path: work/finale
      - name: Run isolated preregistered training to convergence
        shell: bash
        run: |
          set -euo pipefail
          out="results/long/${{ matrix.kind }}_${{ matrix.seed }}"; mkdir -p "work/finale/$out"
          docker run --rm --cpus 4 -e OMP_NUM_THREADS=4 -e OMP_DYNAMIC=FALSE -e OMP_PROC_BIND=close -e OMP_PLACES=cores -v "$PWD/work:/work" -w /work/finale debian:13-slim bash -lc "
            set -euo pipefail; apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libgomp1 util-linux >/dev/null
            taskset -c 0-3 ./project/build/mira_finale_runner train ${{ matrix.kind }} long tokenizer/tokenizer.bin prepared/train.tok prepared/tune.tok orders/train_order_${{ matrix.seed }}.bin orders/tune_windows.bin 0.0048 ${{ matrix.seed }} $out $out/best.bin 2>&1 | tee $out/console.log
          "
          grep -q '^early_stopped=1$' "work/finale/$out/result.txt"; grep -q '^profile_pass=1$' "work/finale/$out/result.txt"
          sha256sum "work/finale/$out/best.bin" > "work/finale/$out/best.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-prebuilt-${{ matrix.kind }}-${{ matrix.seed }}
          path: work/finale/results/long/${{ matrix.kind }}_${{ matrix.seed }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  dev:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with: {name: finale-prepared-prebuilt, path: work/finale}
      - uses: actions/download-artifact@v4
        with: {pattern: 'long-prebuilt-*', path: downloads, merge-multiple: false}
      - name: Reassemble and score TEST-DEV only
        shell: bash
        run: |
          set -euo pipefail
          for kind in f192 gru; do for seed in 1972 2718 3141 1618 2026 5772 8119; do mkdir -p "work/finale/trained/$kind/$seed"; cp -a "downloads/long-prebuilt-$kind-$seed/." "work/finale/trained/$kind/$seed/"; grep -q '^early_stopped=1$' "work/finale/trained/$kind/$seed/result.txt"; grep -q '^profile_pass=1$' "work/finale/trained/$kind/$seed/result.txt"; done; done
          mkdir -p work/finale/eval_dev
          docker run --rm --cpus 4 -e OMP_NUM_THREADS=4 -e OMP_DYNAMIC=FALSE -v "$PWD/work:/work" -w /work/finale debian:13-slim bash -lc '
            set -euo pipefail; apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libgomp1 util-linux >/dev/null
            for kind in f192 gru; do for seed in 1972 2718 3141 1618 2026 5772 8119; do taskset -c 0-3 ./project/build/mira_finale_runner eval "$kind" tokenizer/tokenizer.bin "trained/$kind/$seed/best.bin" prepared/test_dev.tok orders/test_dev_windows.bin "eval_dev/${kind}_${seed}.csv" | tee "eval_dev/${kind}_${seed}.log"; done; done
          '
          test ! -e work/finale/CONFIRM_OPENED_BEFORE_SCORING.json
          python3 work/finale/tools/analyze_final.py dev --root work/finale | tee work/finale/DEV_ANALYSIS_CONSOLE.log
          sha256sum work/finale/DEV_LOCK.json work/finale/DEV_DECISION_FROZEN.md work/finale/dev_analysis.json > work/finale/DEV_FROZEN.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dev-frozen-prebuilt
          path: |
            work/finale/eval_dev
            work/finale/DEV_LOCK.json
            work/finale/DEV_DECISION_FROZEN.md
            work/finale/dev_analysis.json
            work/finale/DEV_FROZEN.sha256
            work/finale/DEV_ANALYSIS_CONSOLE.log
          if-no-files-found: error
          retention-days: 1

  confirm:
    needs: dev
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with: {name: finale-prepared-prebuilt, path: work/finale}
      - uses: actions/download-artifact@v4
        with: {pattern: 'long-prebuilt-*', path: downloads, merge-multiple: false}
      - uses: actions/download-artifact@v4
        with: {name: dev-frozen-prebuilt, path: work/finale}
      - name: Lock CONFIRM opening, score once, and issue sentence
        shell: bash
        run: |
          set -euo pipefail
          for kind in f192 gru; do for seed in 1972 2718 3141 1618 2026 5772 8119; do mkdir -p "work/finale/trained/$kind/$seed"; cp -a "downloads/long-prebuilt-$kind-$seed/." "work/finale/trained/$kind/$seed/"; done; done
          python3 - <<'PY'
          import datetime,hashlib,json
          from pathlib import Path
          r=Path('work/finale'); h=hashlib.sha256((r/'DEV_LOCK.json').read_bytes()).hexdigest(); p=r/'CONFIRM_OPENED_BEFORE_SCORING.json'
          p.write_text(json.dumps({'opened_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'dev_lock_sha256':h,'one_shot':True,'confirm_scored_at_creation':False},indent=2,sort_keys=True)+'\n')
          PY
          sha256sum work/finale/CONFIRM_OPENED_BEFORE_SCORING.json | tee work/finale/CONFIRM_OPENING.sha256
          mkdir -p work/finale/eval_confirm
          docker run --rm --cpus 4 -e OMP_NUM_THREADS=4 -e OMP_DYNAMIC=FALSE -v "$PWD/work:/work" -w /work/finale debian:13-slim bash -lc '
            set -euo pipefail; apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libgomp1 util-linux >/dev/null
            for kind in f192 gru; do for seed in 1972 2718 3141 1618 2026 5772 8119; do taskset -c 0-3 ./project/build/mira_finale_runner eval "$kind" tokenizer/tokenizer.bin "trained/$kind/$seed/best.bin" prepared/test_confirm.tok orders/test_confirm_windows.bin "eval_confirm/${kind}_${seed}.csv" | tee "eval_confirm/${kind}_${seed}.log"; done; done
          '
          python3 work/finale/tools/analyze_final.py final --root work/finale | tee work/finale/FINAL_ANALYSIS_CONSOLE.log
          test -s work/finale/PIPELINE_DONE; cat work/finale/PIPELINE_DONE
          cd work/finale; find . -type f ! -path './FINAL_SHA256_MANIFEST.json' -print0 | sort -z | xargs -0 sha256sum > FINAL_SHA256_MANIFEST.txt; sha256sum FINAL_SHA256_MANIFEST.json FINAL_SHA256_MANIFEST.txt FINALE_F192_GRU_REPORT.md FINAL_STATUS.json > FINAL_TOP_LEVEL.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mira-finale-f192-gru-v2-complete
          path: work/finale
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
